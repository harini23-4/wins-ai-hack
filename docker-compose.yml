# Optional: spin up a local Postgres to test against something closer to prod,
# instead of the default SQLite file. Not required for the hackathon demo.
#
# Usage:
#   docker compose up -d
#   export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/research_collab
#   alembic upgrade head
#   python -m app.seed_data
#   uvicorn app.main:app --reload

version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: research_collab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: